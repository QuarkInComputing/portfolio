<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="/css/cursor.css">
    <link id="variables" rel="stylesheet" href="css/variables.css">

    <title>JMW</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/stylesheet.css">
    <link id="theme-mobile" rel="stylesheet" media="screen and (max-width: 800px)" href="css/mobile.css">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/media/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/media/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/media/favicon/favicon-16x16.png">
    <link rel="manifest" href="/media/favicon/site.webmanifest">

    <!-- Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&family=Stack+Sans+Notch:wght@200..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="nav">
        <div class="nav-links" id="nav-links">
            <a onclick="showSection('work')" class="animate__animated animate__flipInX" href="#">Work</a>
            <a onclick="showSection('about')" class="animate__animated animate__flipInX" href="#">About</a>
            <a onclick="showSection('contact')" class="animate__animated animate__flipInX" href="#">Contact</a>
        </div>
        <img onclick="showSection('landing')" onmouseover="hoverIcon(this)" onmouseleave="unhoverIcon(this)" id="icon"
            src="/media/icon.webp" class="animate__animated">
    </div>

    <section id="section-landing" class="visible-section">
        <div class="title">
            <h1 id="title-name" class="animate__animated animate__fadeInDown">Jack McLean-Wilson</h1>
            <p id="title-job" class="animate__animated animate__fadeInUp">Freelance Web Developer</p>
        </div>
    </section>

    <section id="section-work">
        <div class="title">
            <h1 id="title-name" class="animate__animated animate__fadeInDown">My Work</h1>
            <p id="title-job" class="animate__animated animate__fadeInUp">Everything I Am Proud Of</p>
        </div>
    </section>

    <section id="section-about">
        <div class="title">
            <h1 id="title-name" class="animate__animated animate__fadeInDown">About Me</h1>
            <p id="title-job" class="animate__animated animate__fadeInUp">The Bio Of A Nerd</p>
        </div>
    </section>

    <section id="section-contact">
        <div class="title">
            <h1 id="title-name" class="animate__animated animate__fadeInDown">Get In Touch</h1>
            <p id="title-job" class="animate__animated animate__fadeInUp">Let Me Know If You Have Questions, Requests, Or Just Want To Chat!</p>
        </div>
    </section>

    <div class="background">
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
        <span class="ball"></span>
    </div>
    <div class="cursor"></div>
</body>

<script src="/js/sections.js"></script>
<script src="/js/icon.js"></script>
<script src="/js/cursor.js"></script>

</html>
